{% extends "base.html" %}
{% block title %}Nova solicitação{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Nova solicitação</h1>
{% if not editoras %}
  <div class="alert alert-warning">Não há editoras registadas. Contacte o administrador.</div>
{% else %}
  <div class="card shadow-sm col-lg-8">
    <div class="card-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label" for="editor_id">Editora</label>
          <select class="form-select" name="editor_id" id="editor_id" required>
            <option value="">— Escolher —</option>
            {% for e in editoras %}
              <option value="{{ e.id }}">{{ e.nome }} ({{ e.email }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="conteudo">Mensagem</label>
          <textarea class="form-control" name="conteudo" id="conteudo" rows="5" required placeholder="Descreva o seu pedido…"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Enviar</button>
        <a class="btn btn-link" href="{{ url_for('site.painel_leitor') }}">Cancelar</a>
      </form>
    </div>
  </div>
{% endif %}
{% endblock %}
