{% extends "base.html" %}
{% block title %}Utilizadores{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Utilizadores</h1>
  <a class="btn btn-primary" href="{{ url_for('site.admin_usuario_form') }}">Novo utilizador</a>
</div>
<div class="table-responsive bg-white rounded shadow-sm">
  <table class="table table-hover mb-0">
    <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Papel</th><th class="text-end">Ações</th></tr></thead>
    <tbody>
      {% for u in usuarios %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.nome }}</td>
        <td>{{ u.email }}</td>
        <td><span class="badge bg-secondary">{{ u.papel }}</span></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('site.admin_usuario_form', uid=u.id) }}">Editar</a>
          <form class="d-inline" method="post" action="{{ url_for('site.admin_usuario_excluir', uid=u.id) }}" onsubmit="return confirm('Eliminar {{ u.nome }}?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<p class="mt-3"><a href="{{ url_for('site.painel_admin') }}">← Voltar ao painel</a></p>
{% endblock %}
