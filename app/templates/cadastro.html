{% extends "base.html" %}
{% block title %}Registo de leitor{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">Criar conta (leitor)</h2>
        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label" for="nome">Nome</label>
            <input class="form-control" name="nome" id="nome" required maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" name="email" id="email" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label class="form-label" for="senha">Senha</label>
            <input class="form-control" type="password" name="senha" id="senha" required autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="imagem">Foto de perfil (opcional)</label>
            <input class="form-control" type="file" name="imagem" id="imagem" accept="image/*">
          </div>
          <button type="submit" class="btn btn-primary">Registar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
